<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шалфей | Админ</title>
    <link rel="icon" href="https://raw.githubusercontent.com/ShalfeyArt/main/refs/heads/main/shalfey.ico" type="image/x-icon">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F3F4F6; color: #1F2937; }
        .font-handwritten { font-family: 'Caveat', cursive; }
        .text-sage { color: #8A9A5B; }
        .bg-sage { background-color: #8A9A5B; }
        .hover-bg-sage:hover { background-color: #76854e; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 3px; }
        
        .category-tab.active { background-color: #8A9A5B; color: white; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, onSnapshot, query, orderBy, where, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA8roOb63vM_ZaBt11x8B1b132gQBiG29A",
            authDomain: "shalf-aad46.firebaseapp.com",
            projectId: "shalf-aad46",
            storageBucket: "shalf-aad46.firebasestorage.app",
            messagingSenderId: "131850620388",
            appId: "1:131850620388:web:1afd6733af73f96af0cbf1",
            measurementId: "G-XN22P9DJBZ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let currentCategory = 'rentals'; // Значение по умолчанию
        let productsCache = [];
        const PIN = "141676";

        // --- AUTH ---
        window.checkPin = () => {
            const input = document.getElementById('admin-pin');
            if (input.value === PIN) {
                signInAnonymously(auth).then(() => {
                    document.getElementById('login-screen').classList.add('hidden');
                    document.getElementById('admin-dashboard').classList.remove('hidden');
                    document.getElementById('admin-dashboard').classList.add('flex');
                    initApp();
                }).catch(err => alert("Ошибка соединения: " + err.message));
            } else {
                alert("Неверный PIN");
            }
        };

        function initApp() {
            listenToOrders();
            loadProducts(currentCategory);
        }

        // --- ЗАЯВКИ И ОТВЕТЫ ---
        function listenToOrders() {
            const q = query(collection(db, "orders"), orderBy("createdAt", "desc"));
            const list = document.getElementById('orders-list');
            
            onSnapshot(q, (snapshot) => {
                list.innerHTML = '';
                if(snapshot.empty) {
                    list.innerHTML = '<div class="text-center text-gray-400 mt-10">Нет новых заявок</div>';
                    return;
                }

                snapshot.forEach(docSnap => {
                    const order = docSnap.data();
                    const date = new Date(order.createdAt).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
                    
                    // Цвета статусов
                    let statusClass = 'bg-gray-100 text-gray-500';
                    let statusText = 'Обработано';
                    
                    if(order.status === 'new') { statusClass = 'bg-yellow-100 text-yellow-700'; statusText = 'Новый'; }
                    else if(order.status === 'answered') { statusClass = 'bg-blue-100 text-blue-700'; statusText = 'Отвечен'; }
                    else if(order.status === 'done') { statusClass = 'bg-green-100 text-green-700'; statusText = 'Завершен'; }

                    const el = document.createElement('div');
                    el.className = `bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-3 hover:shadow-md transition`;
                    
                    // HTML карточки заказа
                    el.innerHTML = `
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-xs font-bold px-2 py-1 rounded ${statusClass}">${statusText}</span>
                            <span class="text-xs text-gray-400">${date}</span>
                        </div>
                        <h4 class="font-bold text-gray-800">${order.costume || 'Заявка'}</h4>
                        <div class="text-sm text-gray-600 space-y-1 mt-2">
                            <p><i class="fas fa-user w-4 text-center text-gray-400"></i> ${order.name}</p>
                            <p><i class="fas fa-phone w-4 text-center text-gray-400"></i> ${order.phone || order.email || '-'}</p>
                            ${order.dates ? `<p class="text-sage"><i class="fas fa-calendar w-4 text-center"></i> ${order.dates}</p>` : ''}
                        </div>
                        
                        ${order.message ? `<div class="mt-2 bg-gray-50 p-2 rounded text-sm italic border border-gray-200">"${order.message}"</div>` : ''}

                        <!-- Блок ответа (показываем если есть ответ или если открыто поле ввода) -->
                        <div id="reply-box-${docSnap.id}" class="${order.adminReply ? 'block' : 'hidden'} mt-3 pt-3 border-t border-gray-100">
                             ${order.adminReply 
                                ? `<p class="text-xs font-bold text-blue-600 mb-1">Ваш ответ:</p><p class="text-sm bg-blue-50 p-2 rounded text-gray-700 border border-blue-100">${order.adminReply}</p>`
                                : `<textarea id="reply-text-${docSnap.id}" rows="2" class="w-full text-sm border rounded p-2 focus:ring-1 focus:ring-sage outline-none" placeholder="Напишите ответ клиенту..."></textarea>
                                   <button onclick="window.sendReply('${docSnap.id}')" class="mt-2 text-xs bg-blue-500 text-white px-3 py-1.5 rounded hover:bg-blue-600 shadow-sm">Отправить ответ</button>`
                             }
                        </div>

                        <div class="mt-3 flex gap-2 justify-end">
                            ${!order.adminReply ? `<button onclick="document.getElementById('reply-box-${docSnap.id}').classList.remove('hidden')" class="text-blue-500 hover:bg-blue-50 p-2 rounded text-sm transition" title="Ответить"><i class="fas fa-reply"></i></button>` : ''}
                            
                            ${order.status !== 'done' ? `<button onclick="window.updateStatus('${docSnap.id}', 'done')" class="text-green-500 hover:bg-green-50 p-2 rounded text-sm transition" title="Завершить"><i class="fas fa-check"></i></button>` : ''}
                            
                            <button onclick="window.deleteOrder('${docSnap.id}')" class="text-red-400 hover:bg-red-50 p-2 rounded text-sm transition" title="Удалить"><i class="fas fa-trash"></i></button>
                        </div>
                    `;
                    list.appendChild(el);
                });
            });
        }

        // Отправка ответа
        window.sendReply = async (orderId) => {
            const text = document.getElementById(`reply-text-${orderId}`).value;
            if(!text) return alert("Введите текст ответа");
            
            try {
                await updateDoc(doc(db, "orders", orderId), {
                    adminReply: text,
                    status: 'answered' // Меняем статус на "Отвечен"
                });
                alert("Ответ отправлен! Клиент увидит его на сайте.");
            } catch (e) {
                alert("Ошибка: " + e.message);
            }
        };

        window.updateStatus = async (id, status) => updateDoc(doc(db, "orders", id), { status });
        
        window.deleteOrder = async (id) => {
            if(confirm('Удалить навсегда?')) await deleteDoc(doc(db, "orders", id));
        };


        // --- ТОВАРЫ ---
        window.switchTab = (tab) => {
            currentCategory = tab;
            document.querySelectorAll('.category-tab').forEach(b => b.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            loadProducts(tab);
        };

        async function loadProducts(category) {
            const container = document.getElementById('products-grid');
            container.innerHTML = '<div class="col-span-full text-center py-10"><i class="fas fa-spinner fa-spin text-4xl text-sage"></i></div>';
            
            try {
                const q = query(collection(db, "products"), where("category", "==", category));
                const snapshot = await getDocs(q);
                
                productsCache = [];
                container.innerHTML = '';

                if(snapshot.empty) {
                    container.innerHTML = '<div class="col-span-full flex flex-col items-center justify-center py-20 text-gray-400"><i class="fas fa-box-open text-6xl mb-4 opacity-30"></i><p>Здесь пока пусто.</p></div>';
                    return;
                }

                snapshot.forEach(d => {
                    const item = d.data();
                    item.id = d.id;
                    productsCache.push(item);

                    const img = Array.isArray(item.images) ? item.images[0] : item.images;
                    
                    const card = document.createElement('div');
                    card.className = 'bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden group hover:shadow-lg transition-all duration-300';
                    card.innerHTML = `
                        <div class="h-48 overflow-hidden relative bg-gray-100">
                            <img src="${img}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                            <div class="absolute top-2 right-2 opacity-0 group-hover:opacity-100 transition duration-200 flex gap-2">
                                <button onclick="window.openModal('${item.id}')" class="bg-white w-8 h-8 flex items-center justify-center rounded-full shadow hover:text-blue-500 transition"><i class="fas fa-pencil-alt"></i></button>
                                <button onclick="window.deleteProduct('${item.id}')" class="bg-white w-8 h-8 flex items-center justify-center rounded-full shadow hover:text-red-500 transition"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>
                        <div class="p-4">
                            <h4 class="font-bold text-gray-800 truncate mb-1" title="${item.title}">${item.title}</h4>
                            <p class="text-sage font-bold text-sm">${item.price}</p>
                            <p class="text-xs text-gray-400 mt-2 line-clamp-2">${item.description}</p>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (e) {
                console.error(e);
                container.innerHTML = `<div class="col-span-full text-red-500 text-center">Ошибка: ${e.message}</div>`;
            }
        }

        // --- МОДАЛКА ТОВАРОВ ---
        window.openModal = (id = null) => {
            const modal = document.getElementById('product-modal');
            const form = document.getElementById('product-form');
            const title = document.getElementById('modal-title');
            
            modal.classList.remove('hidden');
            form.reset();
            form.dataset.id = id || ''; // Сохраняем ID если это редактирование

            if(id) {
                title.innerText = "Редактировать товар";
                const item = productsCache.find(p => p.id === id);
                if(item) {
                    form.title.value = item.title;
                    form.price.value = item.price;
                    form.description.value = item.description;
                    const imgs = Array.isArray(item.images) ? item.images : [item.images];
                    form.images.value = imgs.join('\n');
                }
            } else {
                title.innerText = "Добавить новый товар";
            }
        };

        window.closeModal = () => document.getElementById('product-modal').classList.add('hidden');

        window.submitProduct = async (e) => {
            e.preventDefault();
            const form = e.target;
            const id = form.dataset.id;
            
            const data = {
                category: currentCategory,
                title: form.title.value,
                price: form.price.value,
                description: form.description.value,
                images: form.images.value.split('\n').map(s=>s.trim()).filter(s=>s),
                updatedAt: new Date().toISOString()
            };

            const btn = form.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

            try {
                if(id) await updateDoc(doc(db, "products", id), data);
                else {
                    data.createdAt = new Date().toISOString();
                    await addDoc(collection(db, "products"), data);
                }
                closeModal();
                loadProducts(currentCategory);
            } catch(err) {
                alert("Ошибка: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Сохранить";
            }
        };

        window.deleteProduct = async (id) => {
            if(confirm("Удалить этот товар навсегда?")) {
                await deleteDoc(doc(db, "products", id));
                loadProducts(currentCategory);
            }
        }

    </script>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- LOGIN -->
    <div id="login-screen" class="fixed inset-0 z-50 bg-white flex flex-col items-center justify-center p-4">
        <div class="text-center w-full max-w-sm bg-white p-8 rounded-3xl shadow-2xl border border-gray-100">
            <div class="w-16 h-16 bg-sage rounded-full flex items-center justify-center mx-auto mb-6 shadow-lg shadow-green-100">
                <i class="fas fa-leaf text-white text-2xl"></i>
            </div>
            <h1 class="text-4xl font-handwritten text-sage font-bold mb-2">Шалфей</h1>
            <p class="text-gray-400 mb-6">Панель администратора</p>
            <input type="password" id="admin-pin" placeholder="PIN" class="w-full border-2 border-gray-200 rounded-xl p-4 text-center text-2xl mb-4 focus:border-sage outline-none tracking-widest transition">
            <button onclick="checkPin()" class="w-full bg-sage text-white font-bold py-4 rounded-xl hover:bg-opacity-90 transition shadow-lg shadow-green-200">Войти</button>
        </div>
    </div>

    <!-- MAIN -->
    <div id="admin-dashboard" class="hidden flex h-full">
        <!-- Sidebar -->
        <div class="w-96 bg-white border-r flex flex-col z-20 shadow-lg">
            <div class="p-5 border-b bg-gray-50/50">
                <h2 class="text-2xl font-bold font-handwritten text-sage flex items-center gap-2">
                    <i class="fas fa-inbox"></i> Заявки
                </h2>
            </div>
            <div id="orders-list" class="flex-grow overflow-y-auto p-4 bg-gray-50/30 space-y-3">
                <!-- Orders loaded here -->
            </div>
        </div>

        <!-- Content -->
        <div class="flex-grow flex flex-col bg-gray-50 relative">
            <header class="bg-white border-b px-8 py-5 flex justify-between items-center shadow-sm z-10 sticky top-0">
                <div class="flex space-x-2 bg-gray-100 p-1 rounded-xl">
                    <button id="tab-rentals" onclick="switchTab('rentals')" class="category-tab active px-6 py-2 rounded-lg font-bold transition text-sm">Аренда</button>
                    <button id="tab-workshops" onclick="switchTab('workshops')" class="category-tab px-6 py-2 rounded-lg font-bold transition text-sm">МК</button>
                    <button id="tab-handmade" onclick="switchTab('handmade')" class="category-tab px-6 py-2 rounded-lg font-bold transition text-sm">Изделия</button>
                </div>
                <button onclick="window.openModal()" class="bg-sage text-white px-6 py-2.5 rounded-xl hover:bg-opacity-90 transition shadow-lg shadow-green-100 flex items-center gap-2">
                    <i class="fas fa-plus"></i> <span class="hidden md:inline">Добавить товар</span>
                </button>
            </header>

            <div id="products-grid" class="flex-grow overflow-y-auto p-8 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 content-start">
                <!-- Products loaded here -->
            </div>
        </div>
    </div>

    <!-- MODAL -->
    <div id="product-modal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg p-8 transform transition-all">
            <div class="flex justify-between items-center mb-6">
                <h3 id="modal-title" class="text-3xl font-handwritten text-sage font-bold">Товар</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times text-xl"></i></button>
            </div>
            
            <form id="product-form" onsubmit="submitProduct(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Название</label>
                    <input name="title" required placeholder="Например: Осенний венок" class="w-full border-2 border-gray-100 rounded-xl p-3 outline-none focus:border-sage transition">
                </div>
                
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Цена</label>
                    <input name="price" required placeholder="1500 руб." class="w-full border-2 border-gray-100 rounded-xl p-3 outline-none focus:border-sage transition">
                </div>
                
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Описание</label>
                    <textarea name="description" required placeholder="Расскажите о товаре..." class="w-full border-2 border-gray-100 rounded-xl p-3 outline-none focus:border-sage transition resize-none" rows="3"></textarea>
                </div>
                
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Фото (URL)</label>
                    <textarea name="images" required placeholder="Вставьте ссылки на фото (каждая с новой строки)" class="w-full border-2 border-gray-100 bg-gray-50 rounded-xl p-3 outline-none focus:border-sage transition text-xs font-mono" rows="3"></textarea>
                </div>
                
                <div class="flex gap-4 pt-4">
                    <button type="button" onclick="closeModal()" class="flex-1 bg-gray-100 text-gray-600 font-bold py-3 rounded-xl hover:bg-gray-200 transition">Отмена</button>
                    <button type="submit" class="flex-1 bg-sage text-white font-bold py-3 rounded-xl hover:bg-opacity-90 transition shadow-lg shadow-green-100">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
