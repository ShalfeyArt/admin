<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шалфей | Админ</title>
    <link rel="icon" href="https://raw.githubusercontent.com/ShalfeyArt/main/refs/heads/main/shalfey.ico" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; color: #1F2937; }
        .glass-card { background: white; border: 1px solid #e5e7eb; box-shadow: 0 1px 2px 0 rgba(0,0,0,0.05); }
        .font-handwritten { font-family: 'Caveat', cursive; }
        .text-sage { color: #8A9A5B; }
        .bg-sage { background-color: #8A9A5B; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #8A9A5B; border-radius: 2px; }
        .category-tab.active { background-color: #8A9A5B; color: white; }
        .sidebar-transition { transition: transform 0.3s ease-in-out; }
        .sidebar-closed { transform: translateX(-100%); }
        @media (min-width: 1024px) { .sidebar-closed { transform: translateX(0) !important; } }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, onSnapshot, query, orderBy, where, updateDoc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA8roOb63vM_ZaBt11x8B1b132gQBiG29A",
            authDomain: "shalf-aad46.firebaseapp.com",
            projectId: "shalf-aad46",
            storageBucket: "shalf-aad46.firebasestorage.app",
            messagingSenderId: "131850620388",
            appId: "1:131850620388:web:1afd6733af73f96af0cbf1",
            measurementId: "G-XN22P9DJBZ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let currentCategory = 'rentals'; 
        let currentView = 'products'; // products | content

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-dashboard').classList.remove('hidden');
                document.getElementById('admin-dashboard').classList.add('flex');
                initApp();
            } else {
                document.getElementById('login-screen').classList.remove('hidden');
                document.getElementById('admin-dashboard').classList.add('hidden');
            }
        });

        window.login = async (e) => {
            e.preventDefault();
            const email = e.target.email.value;
            const password = e.target.password.value;
            try { await signInWithEmailAndPassword(auth, email, password); } 
            catch (err) { alert("Ошибка входа."); }
        };
        
        window.logout = () => signOut(auth);

        function initApp() {
            listenToOrders();
            loadProducts(currentCategory);
            loadAboutUsContent();
        }

        // --- CMS: ABOUT US ---
        async function loadAboutUsContent() {
            try {
                const docSnap = await getDoc(doc(db, "content", "about_us"));
                if(docSnap.exists()) {
                    document.getElementById('about-us-textarea').value = docSnap.data().text || '';
                }
            } catch(e) { console.error(e); }
        }

        window.saveAboutUs = async () => {
            const text = document.getElementById('about-us-textarea').value;
            const btn = document.getElementById('save-about-btn');
            btn.innerText = "Сохранение...";
            try {
                await setDoc(doc(db, "content", "about_us"), { text: text }, { merge: true });
                alert("Текст 'О нас' обновлен!");
            } catch(e) { alert("Ошибка: " + e.message); }
            finally { btn.innerText = "Сохранить текст"; }
        };

        window.toggleView = (view) => {
            currentView = view;
            if (view === 'products') {
                document.getElementById('products-view').classList.remove('hidden');
                document.getElementById('content-view').classList.add('hidden');
            } else {
                document.getElementById('products-view').classList.add('hidden');
                document.getElementById('content-view').classList.remove('hidden');
            }
        };

        // --- ORDERS ---
        function listenToOrders() {
            const q = query(collection(db, "orders"), orderBy("createdAt", "desc"));
            onSnapshot(q, (snapshot) => {
                const list = document.getElementById('orders-list');
                list.innerHTML = '';
                if(snapshot.empty) { list.innerHTML = '<div class="text-center text-gray-400 mt-10">Нет заявок</div>'; return; }
                snapshot.forEach(docSnap => {
                    const order = docSnap.data();
                    const date = new Date(order.createdAt).toLocaleDateString('ru-RU');
                    
                    let statusColor = order.status === 'new' ? 'text-yellow-600 bg-yellow-100' : 
                                      order.status === 'answered' ? 'text-blue-600 bg-blue-100' : 'text-green-600 bg-green-100';
                    
                    const el = document.createElement('div');
                    el.className = `glass-card p-3 rounded-xl mb-3 border-l-4 ${order.status === 'new' ? 'border-yellow-400' : 'border-transparent'}`;
                    el.innerHTML = `
                        <div class="flex justify-between mb-1">
                            <span class="text-[10px] ${statusColor} px-2 rounded font-bold uppercase">${order.status}</span>
                            <span class="text-[10px] text-gray-400">${date}</span>
                        </div>
                        <h4 class="font-bold text-sm text-gray-800">${order.costume}</h4>
                        <div class="text-xs text-gray-500 mt-1">${order.name || 'Аноним'} (${order.phone || '-'})</div>
                        ${order.message ? `<div class="bg-gray-50 p-2 mt-2 text-xs italic text-gray-600 rounded">"${order.message}"</div>` : ''}
                        
                        <div class="mt-2 flex gap-1 border-t pt-2">
                             ${order.status !== 'done' ? `<button onclick="window.updateStatus('${docSnap.id}', 'done')" class="flex-1 bg-green-50 text-green-600 text-xs py-1 rounded hover:bg-green-100">Завершить</button>` : ''}
                             <button onclick="window.deleteOrder('${docSnap.id}')" class="px-2 text-red-400 hover:text-red-600"><i class="fas fa-trash"></i></button>
                        </div>
                        <div class="mt-2">
                            ${order.adminReply ? `<p class="text-[10px] text-blue-600 bg-blue-50 p-1 rounded">Вы: ${order.adminReply}</p>` : 
                            `<div class="flex gap-1">
                                <input id="reply-${docSnap.id}" class="w-full text-xs border rounded px-1" placeholder="Ответ...">
                                <button onclick="window.sendReply('${docSnap.id}')" class="text-blue-500"><i class="fas fa-paper-plane"></i></button>
                            </div>`}
                        </div>
                    `;
                    list.appendChild(el);
                });
            });
        }
        window.sendReply = async (id) => {
            const val = document.getElementById(`reply-${id}`).value;
            if(val) updateDoc(doc(db, "orders", id), { adminReply: val, status: 'answered' });
        }
        window.updateStatus = (id, s) => updateDoc(doc(db, "orders", id), { status: s });
        window.deleteOrder = (id) => { if(confirm('Удалить?')) deleteDoc(doc(db, "orders", id)); };

        // --- PRODUCTS ---
        window.switchTab = (tab) => {
            currentCategory = tab;
            document.querySelectorAll('.category-tab').forEach(b => b.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            loadProducts(tab);
        };

        async function loadProducts(category) {
            const container = document.getElementById('products-grid');
            container.innerHTML = 'Loading...';
            const q = query(collection(db, "products"), where("category", "==", category));
            const snapshot = await getDocs(q);
            container.innerHTML = '';
            snapshot.forEach(d => {
                const item = d.data();
                container.innerHTML += `
                    <div class="glass-card rounded-lg overflow-hidden group relative">
                        <img src="${Array.isArray(item.images)?item.images[0]:item.images}" class="h-32 w-full object-cover">
                        <div class="p-3">
                            <h4 class="font-bold text-sm truncate">${item.title}</h4>
                            <div class="text-xs text-sage font-bold">${item.price}</div>
                        </div>
                        <button onclick="window.deleteProduct('${d.id}')" class="absolute top-1 right-1 bg-white rounded-full p-1 text-red-500 shadow"><i class="fas fa-trash"></i></button>
                    </div>
                `;
            });
        }
        window.deleteProduct = (id) => { if(confirm('Удалить?')) deleteDoc(doc(db, "products", id)).then(()=>loadProducts(currentCategory)); }

        // Modal Logic
        window.openModal = () => document.getElementById('product-modal').classList.remove('hidden');
        window.closeModal = () => document.getElementById('product-modal').classList.add('hidden');
        window.submitProduct = async (e) => {
            e.preventDefault();
            const f = e.target;
            await addDoc(collection(db, "products"), {
                category: currentCategory,
                title: f.title.value,
                price: f.price.value,
                description: f.description.value,
                images: f.images.value.split('\n'),
                createdAt: new Date().toISOString()
            });
            closeModal(); f.reset(); loadProducts(currentCategory);
        };
    </script>
</head>
<body class="h-screen flex flex-col overflow-hidden bg-gray-100">

    <!-- LOGIN (No Register) -->
    <div id="login-screen" class="fixed inset-0 z-50 bg-gray-800 flex items-center justify-center p-4">
        <form onsubmit="window.login(event)" class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm text-center">
            <h1 class="text-3xl font-handwritten text-sage font-bold mb-6">Вход Админа</h1>
            <input name="email" type="email" placeholder="Email" class="w-full border p-3 rounded-lg mb-3">
            <input name="password" type="password" placeholder="Пароль" class="w-full border p-3 rounded-lg mb-4">
            <button class="w-full bg-sage text-white py-3 rounded-lg font-bold">Войти</button>
            <p class="text-xs text-gray-400 mt-4">Регистрация отключена</p>
        </form>
    </div>

    <!-- DASHBOARD -->
    <div id="admin-dashboard" class="hidden flex h-full">
        <!-- Sidebar -->
        <div id="sidebar" class="sidebar-closed lg:translate-x-0 fixed lg:static inset-y-0 w-80 bg-white border-r z-20 sidebar-transition flex flex-col">
            <div class="p-4 border-b flex justify-between items-center bg-sage text-white">
                <h2 class="font-bold font-handwritten text-xl">Шалфей CMS</h2>
                <button onclick="document.getElementById('sidebar').classList.add('sidebar-closed')" class="lg:hidden"><i class="fas fa-times"></i></button>
            </div>
            
            <div class="flex-1 overflow-y-auto p-4 space-y-4">
                <!-- Navigation -->
                <div class="flex gap-2 mb-4 bg-gray-100 p-1 rounded-lg">
                    <button onclick="toggleView('products')" class="flex-1 py-1 text-xs font-bold rounded shadow-sm bg-white">Товары</button>
                    <button onclick="toggleView('content')" class="flex-1 py-1 text-xs font-bold rounded text-gray-500 hover:bg-white">Контент</button>
                </div>
                
                <h3 class="text-xs font-bold text-gray-400 uppercase">Последние заявки</h3>
                <div id="orders-list" class="space-y-2"></div>
            </div>
            <button onclick="logout()" class="p-4 text-red-500 border-t hover:bg-red-50 text-sm font-bold">Выход</button>
        </div>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col bg-gray-50 relative">
            <header class="bg-white border-b p-4 flex justify-between items-center">
                <button onclick="document.getElementById('sidebar').classList.remove('sidebar-closed')" class="lg:hidden text-gray-600"><i class="fas fa-bars"></i></button>
                <div class="font-bold text-gray-700">Панель управления</div>
            </header>

            <!-- PRODUCTS VIEW -->
            <div id="products-view" class="flex-1 overflow-y-auto p-6">
                <div class="flex justify-between items-center mb-6">
                    <div class="flex gap-2">
                        <button id="tab-rentals" onclick="switchTab('rentals')" class="category-tab active px-4 py-2 rounded-lg font-bold text-sm transition">Аренда</button>
                        <button id="tab-workshops" onclick="switchTab('workshops')" class="category-tab px-4 py-2 rounded-lg font-bold text-sm transition">МК</button>
                        <button id="tab-handmade" onclick="switchTab('handmade')" class="category-tab px-4 py-2 rounded-lg font-bold text-sm transition">Изделия</button>
                    </div>
                    <button onclick="openModal()" class="bg-sage text-white w-10 h-10 rounded-full shadow hover:bg-opacity-90"><i class="fas fa-plus"></i></button>
                </div>
                <div id="products-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
            </div>

            <!-- CONTENT VIEW -->
            <div id="content-view" class="hidden flex-1 p-6">
                <h2 class="text-2xl font-bold mb-4 text-gray-700">Редактирование сайта</h2>
                <div class="bg-white p-6 rounded-xl shadow-sm border">
                    <label class="block font-bold text-gray-600 mb-2">Текст раздела "О нас"</label>
                    <textarea id="about-us-textarea" class="w-full border p-4 rounded-xl h-40 focus:outline-none focus:border-sage mb-4" placeholder="Введите текст..."></textarea>
                    <button id="save-about-btn" onclick="saveAboutUs()" class="bg-sage text-white px-6 py-2 rounded-lg font-bold shadow hover:bg-opacity-90">Сохранить текст</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ADD PRODUCT MODAL -->
    <div id="product-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
        <form onsubmit="submitProduct(event)" class="bg-white w-full max-w-md p-6 rounded-2xl shadow-2xl space-y-3">
            <h3 class="font-bold text-lg mb-2">Добавить товар</h3>
            <input name="title" required placeholder="Название" class="w-full border p-2 rounded">
            <input name="price" required placeholder="Цена" class="w-full border p-2 rounded">
            <textarea name="description" required placeholder="Описание" class="w-full border p-2 rounded" rows="2"></textarea>
            <textarea name="images" required placeholder="URL фото (каждое с новой строки)" class="w-full border p-2 rounded text-xs font-mono" rows="3"></textarea>
            <div class="flex gap-2 pt-2">
                <button type="button" onclick="closeModal()" class="flex-1 bg-gray-100 py-2 rounded">Отмена</button>
                <button class="flex-1 bg-sage text-white py-2 rounded font-bold">Добавить</button>
            </div>
        </form>
    </div>

</body>
</html>
